<!DOCTYPE html>
<html lang="en">

<head>
    <!-- include metadata -->
    <title>{{ page }} | Editor</title>
    <link rel="stylesheet" href="/js/cms/index.css">
    <link rel="stylesheet" href="/js/page/index.css">
</head>

<body>
    <textarea id="editor"></textarea>
    <aside id="sidebar">
        <header class="cms-sidebar-header">
            <h1>Editor</h1>
            <span class="status-pill" data-id="status">New</span>
        </header>
        <div class="cms-actions">
            <button data-id="save">Save</button>
            <button data-id="new">New</button>
            <button data-id="delete">Delete</button>
        </div>
        <label class="field">
            <span>Existing posts</span>
            <select data-id="name-select"></select>
        </label>
        <label class="field">
            <span>Name</span>
            <input type="text" data-id="name" placeholder="post-name">
        </label>
        <label class="field">
            <span>Description</span>
            <textarea data-id="description" rows="4"></textarea>
        </label>
        <div class="field inline-field">
            <span>Private</span>
            <input type="checkbox" data-id="private">
        </div>
        <label class="field">
            <span>Scheduled</span>
            <input type="datetime-local" data-id="scheduled">
        </label>
        <div class="field">
            <span>Tags</span>
            <div data-id="tags"></div>
        </div>
    </aside>
    <div id="FD-message"></div>
    <div id="FD-prompt"></div>
    <script type="module" src="../js/cms/index.js"></script>
</body>

</html>
